version: 2

sources:
  - name: bronze
    database: FRESHROUTE
    schema: BRONZE
    config:
      loaded_at_field: _loaded_at
      freshness:                        # dbt source freshness: the pipeline must have run recently
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: depots
      - name: vehicles
      - name: routes
      - name: deliveries
      - name: gps_pings
      - name: weather_raw
      - name: fx_raw
      - name: bank_holidays_raw
        config:
          freshness:                    # the bank holiday calendar only changes a few times a year
            warn_after: {count: 30, period: day}
            error_after: {count: 90, period: day}
